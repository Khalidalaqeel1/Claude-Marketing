<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عرض تشغيل سويتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">

<!--
  ═══════════════════════════════════════════════════════════════════
  قالب عرض تشغيل سويتي (Suitiee owner proposal)
  عدّل البيانات في الكتلة "proposal" تحت فقط، والصفحات تتحدث تلقائيًا.
  - أي نص يبدأ بـ "[" يظهر كخانة مطلوب تعبئتها (مظللة).
  - الحسابات المالية تتحسب تلقائيًا من الوحدات والأسعار والإشغال والتكاليف.
  - للطباعة PDF: افتح الملف في Chrome ثم طباعة ← حفظ PDF،
    أو شغّل:  node render.js suitiee-proposal.html out.pdf
  ═══════════════════════════════════════════════════════════════════
-->
<script type="application/json" id="proposal">
{
  "owner": "[اسم المالك]",
  "date": "[نوفمبر 2026]",
  "property": {
    "name": "[اسم العقار]",
    "location": "[المدينة · الحي]",
    "facts": [
      { "k": "نوع العقار", "v": "[عمارة سكنية]" },
      { "k": "حالة الوحدات", "v": "[مؤثثة / تحتاج تجهيز]" },
      { "k": "الترخيص", "v": "[ترخيص وزارة السياحة]" }
    ],
    "mapImage": "",
    "photo": ""
  },

  "scenarios": ["متحفظ", "متوازن", "متفائل"],
  "daysPerYear": 365,
  "units": [
    { "name": "استوديو",          "plural": "الاستوديوهات",      "count": 8, "rate": [260, 300, 360], "occupancy": [0.66, 0.66, 0.66] },
    { "name": "شقة غرفة وصالة",   "plural": "شقق غرفة وصالة",   "count": 7, "rate": [360, 400, 460], "occupancy": [0.66, 0.66, 0.66] }
  ],
  "costs": [
    { "name": "رسوم إدارة سويتي",          "pct": [0.15, 0.15, 0.15] },
    { "name": "الماء والكهرباء والإنترنت",  "pct": [0.07, 0.07, 0.07] },
    { "name": "النظافة",                    "pct": [0.05, 0.05, 0.05] },
    { "name": "الصيانة الدورية",            "pct": [0.03, 0.03, 0.03] }
  ],
  "notes": [
    "متوسط الإشغال المستخدم في الدراسة قابل للزيادة حسب خطة التسويق والتسعير الديناميكي وأداء القنوات.",
    "الأرقام تقديرية مبنية على أسعار السوق الحالية، وتتحدث بعد أول 90 يوم تشغيل."
  ],

  "stats": [
    { "icon": "units",  "value": "[00+]",   "label": "وحدة نديرها" },
    { "icon": "star",   "value": "[4.8/5]", "label": "متوسط تقييم الضيوف" },
    { "icon": "cal",    "value": "[00%]",   "label": "متوسط الإشغال" },
    { "icon": "trend",  "value": "[00+]",   "label": "سنوات خبرة" }
  ],

  "contact": {
    "whatsapp": "[05XXXXXXXX]",
    "website": "suitiee.com",
    "instagram": "@suitiee.sa",
    "legalName": "[الاسم التجاري للمنشأة]",
    "cr": "[رقم السجل التجاري]"
  }
}
</script>

<style>
:root{
  --ink:#16130F; --ink2:#3B3630; --muted:#6B645B; --muted2:#787165;
  --line:#E6E3DE; --soft:#FAFAF9; --soft2:#F4F2EF; --paper:#FFFFFF;
  --acc:#A8481B; --acc-soft:#FCF3EE;
  --d-bg:#16130F; --d-panel:#211D18; --d-row:#2A2520; --d-line:#3A342D; --d-ink:#FAFAF9; --d-muted:#A39B90; --d-sub:#D6D0C7;
  --info:#1B5DA6; --info-soft:#EBF2FA; --ok:#0E7150; --ok-soft:#EAF6F1; --warn:#9A6B00; --warn-soft:#FBF3E0;
  --ar:"IBM Plex Sans Arabic","Inter",sans-serif;
  --la:"Inter","IBM Plex Sans Arabic",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#E9E6E1}
body{background:#E9E6E1;font-family:var(--ar);color:var(--ink);padding:24px 16px 64px;-webkit-font-smoothing:antialiased}
.deck{display:flex;flex-direction:column;align-items:center;gap:24px}
.frame{width:calc(1920px * var(--z,1));height:calc(1080px * var(--z,1));box-shadow:0 20px 50px -25px rgba(22,19,15,.35);border-radius:6px;overflow:hidden;flex:none}
.slide{width:1920px;height:1080px;position:relative;overflow:hidden;background:var(--paper);transform:scale(var(--z,1));transform-origin:top right}
[dir=rtl] .slide{transform-origin:top right}

@page{size:1920px 1080px;margin:0}
@media print{
  html,body{background:none;padding:0}
  .deck{gap:0;display:block}
  .frame{--z:1;width:1920px;height:1080px;box-shadow:none;border-radius:0;break-after:page;page-break-after:always}
  .frame:last-child{break-after:auto;page-break-after:auto}
  .slide{transform:none}
}

/* ── shared pieces ─────────────────────────────── */
.word{font-family:var(--la);font-weight:600;letter-spacing:-.025em;direction:ltr;unicode-bidi:isolate;color:var(--ink);white-space:nowrap}
.word b{color:var(--acc);font-weight:600}
.dark .word{color:var(--d-ink)}
.eyebrow{font-size:28px;font-weight:600;color:var(--acc);display:flex;align-items:center;gap:14px}
.eyebrow::before{content:"";width:36px;height:4px;border-radius:2px;background:var(--acc)}
h1{font-weight:600;letter-spacing:-.01em;line-height:1.18;text-wrap:balance}
.lat{font-family:var(--la);direction:ltr;unicode-bidi:isolate;display:inline-block}
.ph{background:var(--acc-soft);color:var(--acc);border:2px dashed #E3B8A2;border-radius:10px;padding:0 .3em;font-style:normal;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.dark .ph{background:#3A2418;color:#F2B898;border-color:#7A3E22}

.foot{position:absolute;inset-inline:96px;bottom:44px;display:flex;justify-content:space-between;align-items:center;font-size:22px;color:var(--muted2)}
.foot .word{font-size:28px}
.foot .pg{font-family:var(--la);font-weight:500}
.dark .foot{color:var(--d-muted)}

/* calendar motif (brand texture, from the Suitiee ad panels) */
.cal{display:grid;gap:10px;font-size:20px}
.cal .d{text-align:center;color:var(--muted2);font-family:var(--la);font-weight:500}
.cal .u{color:var(--ink2);display:flex;align-items:center;font-size:22px;white-space:nowrap}
.cal .c{border-radius:12px;background:var(--paper);border:2px solid var(--line)}
.cal .bar{border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:600;font-family:var(--la);white-space:nowrap;overflow:hidden}
.b-acc{background:var(--acc-soft);color:var(--acc)} .b-info{background:var(--info-soft);color:var(--info)} .b-ok{background:var(--ok-soft);color:var(--ok)}

/* ── 1. cover ──────────────────────────────────── */
.cover{display:grid;grid-template-columns:1fr 820px;gap:96px;padding:96px;align-items:center}
.cover .id .word{font-size:200px;line-height:1}
.cover .id .ar{font-size:44px;color:var(--muted);margin-top:8px}
.cover .tag{font-size:56px;font-weight:600;line-height:1.25;margin-top:72px;max-width:16ch;text-wrap:balance}
.cover .for{margin-top:72px;display:flex;flex-direction:column;gap:14px;font-size:30px;color:var(--ink2)}
.cover .for span{color:var(--muted2);font-size:24px;display:block;margin-bottom:2px}
.cover .for .row{display:flex;gap:64px}
.cover .panel{background:var(--soft);border:2px solid var(--line);border-radius:36px;padding:44px;box-shadow:0 40px 80px -40px rgba(22,19,15,.3);display:flex;flex-direction:column;gap:28px}
.cover .ph-head{display:flex;justify-content:space-between;align-items:center;font-size:24px;color:var(--muted)}
.cover .ph-head strong{color:var(--ink);font-size:30px;font-weight:600}
.cover .sync{display:flex;align-items:center;justify-content:space-between;background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:20px 26px;font-size:26px}
.chip{border-radius:999px;padding:6px 18px;font-size:22px;font-weight:600;white-space:nowrap}
.c-ok{background:var(--ok-soft);color:var(--ok)}

/* ── 2. about ──────────────────────────────────── */
.about{display:grid;grid-template-columns:1fr 760px;gap:112px;padding:120px 96px 140px}
.about h1{font-size:80px;margin-top:28px}
.about p{font-size:31px;line-height:1.75;color:var(--ink2);margin-top:36px;max-width:36ch}
.about .cards{display:flex;flex-direction:column;gap:28px;justify-content:center}
.card{background:var(--soft);border:2px solid var(--line);border-radius:28px;padding:40px 44px}
.card .k{display:inline-block;font-size:22px;font-weight:600;border-radius:999px;padding:6px 18px;background:var(--paper);border:2px solid var(--line);color:var(--muted)}
.card h3{font-size:42px;font-weight:600;margin-top:20px}
.card p{font-size:27px;color:var(--muted);margin-top:10px;line-height:1.6;max-width:none}
.card .chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.card .chips span{font-size:22px;font-weight:500;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:6px 18px;color:var(--ink2)}
.card.main{background:var(--ink);border-color:var(--ink);color:var(--d-ink)}
.card.main .k{background:var(--acc);border-color:var(--acc);color:#fff}
.card.main p{color:var(--d-sub)}
.card.main .chips span{background:var(--d-row);border-color:var(--d-line);color:var(--d-ink)}
.rail{position:absolute;inset-block:120px 140px;inset-inline-end:0;width:14px;background:var(--acc);border-radius:7px 0 0 7px}

/* ── 3. approach ───────────────────────────────── */
.approach{padding:100px 96px 140px;display:flex;flex-direction:column;gap:56px}
.approach .top{display:grid;grid-template-columns:1fr 1fr;gap:96px;align-items:end}
.approach h1{font-size:72px;margin-top:24px}
.approach .top p{font-size:29px;line-height:1.7;color:var(--ink2)}
.stages{display:grid;grid-template-columns:1fr 64px 1fr 64px 1fr;align-items:stretch;flex:1}
.stage{display:flex;flex-direction:column;gap:16px}
.stage .sh{display:flex;align-items:center;gap:18px;margin-bottom:8px}
.stage .n{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--la);font-weight:600;font-size:28px;background:var(--ink);color:#fff;flex:none}
.stage .sh b{font-size:36px;font-weight:600;display:block}
.stage .sh small{font-size:22px;color:var(--muted2);display:block}
.tile{flex:1;border-radius:20px;display:flex;align-items:center;padding:0 30px;font-size:28px;font-weight:600;background:var(--soft2);border:2px solid var(--line)}
.tile i{font-style:normal;font-family:var(--la);font-weight:500;color:var(--muted2);font-size:22px;margin-inline-start:auto}
.stage.mid .tile{background:var(--ink);border-color:var(--ink);color:var(--d-ink)}
.stage.mid .tile i{color:var(--d-muted)}
.stage.mid .n{background:var(--acc)}
.arrow{display:flex;align-items:center;justify-content:center}
.arrow svg{width:44px;height:44px;color:var(--muted2)}

/* ── 4. stats (dark) ───────────────────────────── */
.dark{background:var(--d-bg);color:var(--d-ink)}
.stats{padding:110px 96px 150px;display:flex;flex-direction:column;align-items:center;gap:80px}
.stats .head{text-align:center;display:flex;flex-direction:column;align-items:center;gap:24px}
.stats .eyebrow{justify-content:center}
.stats h1{font-size:80px}
.stats .sub{font-size:30px;color:var(--d-sub)}
.statgrid{width:100%;display:grid;grid-template-columns:repeat(4,1fr);background:var(--d-panel);border:2px solid var(--d-line);border-radius:36px;flex:1}
.stat{padding:56px 48px;display:flex;flex-direction:column;justify-content:center;gap:28px;border-inline-start:2px solid var(--d-line)}
.stat:first-child{border-inline-start:0}
.stat .ic{width:76px;height:76px;border-radius:20px;background:var(--d-row);border:2px solid var(--d-line);display:flex;align-items:center;justify-content:center;color:#F2B898}
.stat .ic svg{width:38px;height:38px}
.stat .v{font-family:var(--la);font-weight:600;font-size:96px;line-height:1;direction:ltr;text-align:right;letter-spacing:-.02em}
.stat .v .ph{font-size:72px;border-radius:14px}
.stat .l{font-size:30px;color:var(--d-sub)}

/* ── 5. property (dark) ────────────────────────── */
.prop{display:grid;grid-template-columns:760px 1fr;grid-template-rows:auto 1fr;gap:32px;padding:88px 96px 140px}
.prop .info{background:var(--soft);color:var(--ink);border-radius:32px;padding:48px 52px;display:flex;flex-direction:column;gap:22px}
.prop .info .eyebrow{font-size:24px}
.prop .info h2{font-size:56px;font-weight:600;line-height:1.2}
.prop .loc{display:flex;align-items:center;gap:12px;font-size:28px;color:var(--ink2)}
.prop .loc svg{width:30px;height:30px;color:var(--acc);flex:none}
.prop .mix{display:flex;flex-wrap:wrap;gap:12px}
.prop .mix span{font-size:24px;font-weight:600;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:8px 20px}
.prop .mix b{font-family:var(--la);color:var(--acc);margin-inline-end:6px}
.prop dl{display:grid;grid-template-columns:auto 1fr;gap:12px 28px;font-size:25px;border-top:2px solid var(--line);padding-top:22px}
.prop dt{color:var(--muted2)} .prop dd{font-weight:500}
.slot{border-radius:32px;overflow:hidden;background:var(--d-panel);border:2px dashed var(--d-line);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;color:var(--d-muted);font-size:28px;position:relative}
.slot svg{width:64px;height:64px;opacity:.7}
.slot small{font-size:20px;font-family:var(--la);direction:ltr}
.slot.has{border:0}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.prop .map{grid-row:1 / span 2;grid-column:2;display:flex}
.prop .photo{grid-column:1;grid-row:2;display:flex}
.prop .slot{flex:1}

/* ── 6. financial study ────────────────────────── */
.fin .foot{display:none}
.fin{padding:56px 96px 56px;display:flex;flex-direction:column;gap:20px}
.fin .top{display:flex;justify-content:space-between;align-items:flex-end;gap:48px}
.fin h1{font-size:52px;margin-top:10px}
.fin .meta{font-size:24px;color:var(--muted);text-align:left;line-height:1.6}
.fin .meta b{color:var(--ink);font-weight:600}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:24px}
th,td{height:var(--rh,42px);padding:0 24px;text-align:right;white-space:nowrap}
td.n,th.n{text-align:center;font-family:var(--la);font-variant-numeric:tabular-nums;width:300px;direction:ltr}
thead th{height:56px;font-size:26px;font-weight:600;vertical-align:middle}
thead th.n{text-align:center;font-family:var(--ar)}
thead th.n span{display:inline-flex;align-items:center;gap:12px;border-radius:999px;padding:8px 24px}
thead th.n span::before{content:"";width:12px;height:12px;border-radius:50%;background:currentColor}
.s0{background:var(--info-soft);color:var(--info)} .s1{background:var(--ok-soft);color:var(--ok)} .s2{background:var(--warn-soft);color:var(--warn)}
thead th:first-child{font-size:20px;color:var(--muted2);font-weight:500}
tbody td{border-bottom:1.5px solid var(--line);color:var(--ink2)}
tr.grp td{background:var(--soft2);font-weight:600;color:var(--ink);border-bottom:0;font-size:24px}
tr.grp td:first-child{border-radius:0 12px 12px 0} tr.grp td:last-child{border-radius:12px 0 0 12px}
tr.grp td small{font-weight:500;color:var(--muted2);font-size:21px;margin-inline-start:10px}
tr.sub td{font-weight:600;color:var(--ink)}
tr.tot td{font-weight:700;color:var(--ink);border-bottom:2px solid var(--ink)}
td .pct{color:var(--muted2);font-weight:500;font-size:19px;margin-inline-end:12px}
tr.net td{height:64px;background:var(--ink);color:var(--d-ink);font-size:30px;font-weight:700;border:0}
tr.net td.n{color:#fff;font-size:34px}
tr.net td:first-child{border-radius:0 18px 18px 0} tr.net td:last-child{border-radius:18px 0 0 18px}
tr.net td:first-child::after{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--acc);margin-inline-start:16px;vertical-align:middle}
tr.mo td{color:var(--muted);border:0;font-size:23px}
tr.mo td.n{color:var(--ink);font-weight:600}
tr.gap td{height:8px;border:0;padding:0}
.notes{display:flex;gap:18px;font-size:20px;color:var(--muted);line-height:1.5;border-top:2px solid var(--line);padding-top:14px}
.notes b{color:var(--ink);font-weight:600;white-space:nowrap}
.notes ul{list-style:none;display:flex;flex-direction:column;gap:2px}
.notes li::before{content:"· ";color:var(--acc);font-weight:700}

/* ── 7. closing ────────────────────────────────── */
.close{display:grid;grid-template-columns:1fr 760px;gap:112px;padding:110px 96px 96px;align-items:center}
.close .word{font-size:150px;line-height:1}
.close h1{font-size:68px;margin-top:56px;max-width:15ch}
.close .cta{display:inline-flex;margin-top:48px;background:var(--acc);color:#fff;border-radius:18px;padding:26px 44px;font-size:34px;font-weight:600}
.close .legal{margin-top:64px;font-size:22px;color:var(--muted2);line-height:1.7}
.contacts{display:flex;flex-direction:column;gap:20px}
.ct{display:flex;align-items:center;gap:26px;background:var(--soft);border:2px solid var(--line);border-radius:26px;padding:30px 36px}
.ct .ic{width:72px;height:72px;border-radius:20px;background:var(--paper);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--acc);flex:none}
.ct .ic svg{width:36px;height:36px}
.ct small{display:block;font-size:22px;color:var(--muted2)}
.ct b{display:block;font-size:36px;font-weight:600;margin-top:2px}
.ct b.lat{font-family:var(--la);letter-spacing:-.01em}
</style>
</head>
<body>
<main class="deck" id="deck"></main>

<script>
(function(){
  const D = JSON.parse(document.getElementById('proposal').textContent);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  // any value starting with "[" is a placeholder to fill
  const t = s => { s = String(s ?? ''); return s.trim().startsWith('[') ? `<em class="ph">${esc(s.replace(/^\s*\[|\]\s*$/g,''))}</em>` : esc(s); };
  const num = n => Math.round(n).toLocaleString('en-US');
  const pct = p => `${Math.round(p*1000)/10}%`;
  const WORD = '<span class="word">Suit<b>i</b>ee</span>';
  const N = D.scenarios.length;

  const ICON = {
    trend:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>',
    star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>',
    units:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 21V5l8-3 8 3v16"/><path d="M9 21v-4h6v4M8 8h2M14 8h2M8 12h2M14 12h2"/><path d="M2 21h20"/></svg>',
    cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 10-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>',
    img:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>',
    map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>',
    wa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 20l1.3-3.9A8 8 0 1112 20a8 8 0 01-3.9-1z"/><path d="M9 9.5c.3 2 1.8 3.8 4 4.6l1.2-1.2 1.8.8-.4 1.6c-3.6 0-7-3.2-7.2-6.8L10 8l.8 1.8z" fill="currentColor" stroke-width="1"/></svg>',
    web:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 2.5 15.3 0 18M12 3c-2.5 2.7-2.5 15.3 0 18"/></svg>',
    ig:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>',
    arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"><path d="M20 12H4"/><path d="M9 7l-5 5 5 5" stroke-dasharray="none"/></svg>'
  };

  // brand calendar motif
  function calendar(rows, {cell=58, unitW=150, label=true} = {}){
    const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    let h = `<div class="cal" style="grid-template-columns:${label?unitW+'px ':''}repeat(7,1fr);grid-auto-rows:${cell}px">`;
    h += (label?'<span></span>':'') + days.map(d=>`<span class="d" style="align-self:center">${d}</span>`).join('');
    rows.forEach(([name, bars]) => {
      if(label) h += `<span class="u">${esc(name)}</span>`;
      let col = 0;
      bars.forEach(([s,n,lab,c]) => {
        while(col < s){ h += '<span class="c"></span>'; col++; }
        h += `<span class="bar ${c}" style="grid-column:span ${n}">${esc(lab)}</span>`; col += n;
      });
      while(col < 7){ h += '<span class="c"></span>'; col++; }
    });
    return h + '</div>';
  }
  const CAL_ROWS = [
    ['شقة 101', [[0,3,'Airbnb','b-acc'],[4,3,'Booking','b-info']]],
    ['شقة 102', [[1,2,'Gathern','b-ok'],[3,4,'Airbnb','b-acc']]],
    ['استوديو 1', [[0,2,'Booking','b-info'],[2,3,'Gathern','b-ok']]],
    ['استوديو 2', [[2,5,'Airbnb','b-acc']]],
    ['استوديو 3', [[0,4,'Gathern','b-ok'],[5,2,'Booking','b-info']]]
  ];

  // ── financial model ──
  const days = D.daysPerYear || 365;
  const unitRev = D.units.map(u => D.scenarios.map((_,i) => u.count * u.rate[i] * days * u.occupancy[i]));
  const totRev  = D.scenarios.map((_,i) => unitRev.reduce((a,r) => a + r[i], 0));
  const costAmt = D.costs.map(c => D.scenarios.map((_,i) => totRev[i] * c.pct[i]));
  const totCost = D.scenarios.map((_,i) => costAmt.reduce((a,r) => a + r[i], 0));
  const net     = D.scenarios.map((_,i) => totRev[i] - totCost[i]);
  const totalUnits = D.units.reduce((a,u)=>a+u.count,0);

  const slides = [];
  let page = 0;
  const foot = (dark) => `<div class="foot">${WORD}<span>عرض تشغيل · ${t(D.property.name)}</span><span class="pg">${String(page).padStart(2,'0')}</span></div>`;

  // 1. cover
  page++;
  slides.push(`<section class="slide cover">
    <div class="id">
      ${WORD.replace('class="word"','class="word"')}
      <div class="ar">سويتي</div>
      <h1 class="tag">إدارة وتشغيل شقق الإيجار اليومي</h1>
      <div class="for">
        <div class="row">
          <div><span>عرض مقدّم إلى</span>${t(D.owner)}</div>
          <div><span>العقار</span>${t(D.property.name)}</div>
          <div><span>التاريخ</span>${t(D.date)}</div>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="ph-head"><strong>تقويم واحد لكل الوحدات</strong><span>هذا الأسبوع</span></div>
      ${calendar(CAL_ROWS)}
      <div class="sync"><span>كل المنصات متزامنة · بدون حجز مكرر</span><span class="chip c-ok">متزامن</span></div>
    </div>
  </section>`);

  // 2. about
  page++;
  slides.push(`<section class="slide about">
    <div>
      <div class="eyebrow">عن سويتي</div>
      <h1>نرفع دخل شقتك،<br>ونريّحك من تشغيلها</h1>
      <p>سويتي تدير وتشغّل شقق الإيجار اليومي نيابةً عن ملّاكها. نتولى كل شي من الإعلان على المنصات والتسعير، إلى استقبال الضيوف والتنظيف والصيانة.</p>
      <p>وكل شهر يوصلك تقرير واضح بالحجوزات والإيرادات والمصاريف، وأنت تتابع من مكانك.</p>
    </div>
    <div class="cards">
      <div class="card main">
        <span class="k">الخيار الأول</span>
        <h3>الإدارة الكاملة</h3>
        <p>نستلم الشقة ونشغّلها بالكامل، من أول إعلان إلى تحويل صافي الأرباح.</p>
        <div class="chips"><span>القنوات والتسعير</span><span>الضيوف</span><span>التنظيف</span><span>الصيانة</span><span>التقرير الشهري</span></div>
      </div>
      <div class="card">
        <span class="k">الخيار الثاني</span>
        <h3>إدارة القنوات</h3>
        <p>نعلن ونسعّر ونرد على الحجوزات، والتشغيل اليومي يبقى عندك.</p>
        <div class="chips"><span class="lat">Airbnb</span><span class="lat">Booking</span><span>جاذر إن</span><span>التسعير الديناميكي</span></div>
      </div>
    </div>
    <div class="rail"></div>
    ${foot()}
  </section>`);

  // 3. approach
  page++;
  const stage = (n, name, sub, tiles, cls='') => `<div class="stage ${cls}">
      <div class="sh"><span class="n">${n}</span><div><b>${name}</b><small>${sub}</small></div></div>
      ${tiles.map(x=>`<div class="tile">${x}</div>`).join('')}
    </div>`;
  slides.push(`<section class="slide approach">
    <div class="top">
      <div><div class="eyebrow">نهجنا</div><h1>رحلة واضحة من الدراسة<br>إلى أول حجز… وبعده</h1></div>
      <p>كل عقار يمشي على نموذج تشغيل منظّم: نبدأ بالأرقام، نجهّز الوحدة والقنوات، ثم نشغّل يوميًا بمعايير ثابتة تحمي قيمة الأصل وترفع العائد.</p>
    </div>
    <div class="stages">
      ${stage(1,'ندرس','قبل ما نبدأ',['دراسة الجدوى','اختيار نموذج التشغيل','التسعير المقترح','قائمة التجهيز والتأثيث'])}
      <div class="arrow">${ICON.arrow}</div>
      ${stage(2,'نجهّز','أول 30 يوم',['ترخيص وزارة السياحة','التصوير وكتابة الإعلان','ربط المنصات بتقويم واحد','الدخول الذاتي والتجهيزات'],'mid')}
      <div class="arrow">${ICON.arrow}</div>
      ${stage(3,'نشغّل ونحقق الربح','كل يوم',['استقبال الضيوف والرد 24/7','تنظيف موثّق بالصور','الصيانة الدورية','تسعير ديناميكي وتقرير شهري'])}
    </div>
    ${foot()}
  </section>`);

  // 4. stats
  page++;
  slides.push(`<section class="slide dark stats">
    <div class="head">
      <div class="eyebrow">سويتي بالأرقام</div>
      <h1>نتائج تتكرر… حجز بعد حجز</h1>
      <div class="sub">أرقام تشغيلية من الوحدات اللي نديرها اليوم.</div>
    </div>
    <div class="statgrid">
      ${D.stats.map(s=>`<div class="stat"><span class="ic">${ICON[s.icon]||ICON.trend}</span><div class="v">${t(s.value)}</div><div class="l">${t(s.label)}</div></div>`).join('')}
    </div>
    ${foot(true)}
  </section>`);

  // 5. property
  page++;
  const slot = (src, icon, label) => src
    ? `<div class="slot has"><img src="${esc(src)}" alt=""></div>`
    : `<div class="slot">${ICON[icon]}<span>${label}</span><small>property.${icon==='map'?'mapImage':'photo'}</small></div>`;
  slides.push(`<section class="slide dark prop">
    <div class="info">
      <div class="eyebrow">العقار</div>
      <h2>${t(D.property.name)}</h2>
      <div class="loc">${ICON.pin}<span>${t(D.property.location)}</span></div>
      <div class="mix">${D.units.map(u=>`<span><b>${u.count}</b>${esc(u.name)}</span>`).join('')}<span><b>${totalUnits}</b>وحدة إجمالًا</span></div>
      <dl>${D.property.facts.map(f=>`<dt>${esc(f.k)}</dt><dd>${t(f.v)}</dd>`).join('')}</dl>
    </div>
    <div class="map">${slot(D.property.mapImage,'map','صورة الموقع على الخريطة')}</div>
    <div class="photo">${slot(D.property.photo,'img','صورة واجهة العقار')}</div>
    ${foot(true)}
  </section>`);

  // 6. financial study
  page++;
  const cells = arr => arr.map(v=>`<td class="n">${num(v)}</td>`).join('');
  let rows = '';
  D.units.forEach((u,k) => {
    rows += `<tr class="grp"><td colspan="${N+1}">${esc(u.plural||u.name)}<small>${u.count} وحدات</small></td></tr>`;
    rows += `<tr><td>سعر الليلة</td>${u.rate.map(v=>`<td class="n">${num(v)}</td>`).join('')}</tr>`;
    rows += `<tr><td>متوسط نسبة الإشغال السنوية</td>${u.occupancy.map(v=>`<td class="n">${pct(v)}</td>`).join('')}</tr>`;
    rows += `<tr class="sub"><td>إيراد ${esc(u.plural||u.name)} بالسنة</td>${cells(unitRev[k])}</tr>`;
  });
  rows += `<tr class="gap"><td colspan="${N+1}"></td></tr><tr class="tot"><td>إجمالي الإيراد السنوي المتوقع</td>${cells(totRev)}</tr>`;
  rows += `<tr class="gap"><td colspan="${N+1}"></td></tr><tr class="grp"><td colspan="${N+1}">التكاليف التشغيلية السنوية<small>نسبة من الإيراد</small></td></tr>`;
  D.costs.forEach((c,k) => {
    rows += `<tr><td>${esc(c.name)}</td>${costAmt[k].map((v,i)=>`<td class="n"><span class="pct">${pct(c.pct[i])}</span>${num(v)}</td>`).join('')}</tr>`;
  });
  rows += `<tr class="tot"><td>إجمالي التكاليف التشغيلية</td>${cells(totCost)}</tr>`;
  rows += `<tr class="gap"><td colspan="${N+1}"></td></tr><tr class="net"><td>صافي الأرباح للمالك سنويًا</td>${cells(net)}</tr>`;
  rows += `<tr class="mo"><td>متوسط صافي الربح الشهري</td>${cells(net.map(v=>v/12))}</tr>`;
  const extra = Math.max(0, D.units.length - 2) * 4 + Math.max(0, D.costs.length - 4);
  const rh = Math.max(28, 35 - extra * 2);
  slides.push(`<section class="slide fin" style="--rh:${rh}px">
    <div class="top">
      <div><div class="eyebrow">الدراسة المالية</div><h1>الإيراد والعائد المتوقع سنويًا</h1></div>
      <div class="meta"><b>${t(D.property.name)}</b> · ${totalUnits} وحدة<br>المبالغ بالريال السعودي · ${days} يوم بالسنة</div>
    </div>
    <table>
      <thead><tr><th>البند</th>${D.scenarios.map((s,i)=>`<th class="n"><span class="s${i%3}">${esc(s)}</span></th>`).join('')}</tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="notes"><b>ملاحظات الدراسة</b><ul>${D.notes.map(n=>`<li>${t(n)}</li>`).join('')}</ul></div>
    ${foot()}
  </section>`);

  // 7. closing
  page++;
  slides.push(`<section class="slide close">
    <div>
      ${WORD}
      <h1>خلّ شقتك تشتغل…<br>وأنت مرتاح</h1>
      <div class="cta">احجز مكالمة تعريفية</div>
      <div class="legal">${t(D.contact.legalName)}<br>السجل التجاري: ${t(D.contact.cr)}</div>
    </div>
    <div class="contacts">
      <div class="ct"><span class="ic">${ICON.wa}</span><div><small>واتساب</small><b class="lat">${t(D.contact.whatsapp)}</b></div></div>
      <div class="ct"><span class="ic">${ICON.web}</span><div><small>الموقع</small><b class="lat">${t(D.contact.website)}</b></div></div>
      <div class="ct"><span class="ic">${ICON.ig}</span><div><small>انستقرام</small><b class="lat">${t(D.contact.instagram)}</b></div></div>
    </div>
  </section>`);

  const deck = document.getElementById('deck');
  deck.innerHTML = slides.map(s => `<div class="frame">${s}</div>`).join('');

  const fit = () => {
    const z = Math.min(1, (document.documentElement.clientWidth - 32) / 1920);
    document.documentElement.style.setProperty('--z', z);
  };
  fit(); addEventListener('resize', fit);
  addEventListener('beforeprint', () => document.documentElement.style.setProperty('--z', 1));
  addEventListener('afterprint', fit);
})();
</script>
</body>
</html>
