<script>
(function(){
  // a client file can be injected by render.js / export-pptx.js (--data clients/x/data.json)
  const D = window.__PROPOSAL || JSON.parse(document.getElementById('proposal').textContent);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  // "[..]" → highlighted placeholder (brackets kept in the text so they survive export)
  const t = s => { s = String(s ?? ''); return s.trim().startsWith('[') ? `<span class="ph">${esc(s)}</span>` : esc(s); };
  const br = s => t(s).replace(/\n/g, '<br>');
  const num = n => Math.round(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  const pct = p => `${Math.round(p*1000)/10}%`;

  // brand pattern: rows of Suitiee doors (from the logo) on ink
  const doorSvg = (fill, ground, key, stroke) => {
    const arch = (x,y) => `<path d="M${x} ${y+36}A36 36 0 0 1 ${x+72} ${y+36}V${y+100}H${x}Z" ${stroke?`fill="none" stroke="${fill}" stroke-width="5"`:`fill="${fill}"`}/>`
      + (key ? `<circle cx="${x+36}" cy="${y+44}" r="8" fill="${key}"/><path d="M${x+31} ${y+50}L${x+29} ${y+80}H${x+43}L${x+41} ${y+50}Z" fill="${key}"/>` : '');
    return `<svg xmlns="http://www.w3.org/2000/svg" width="96" height="240">${ground?`<rect width="96" height="240" fill="${ground}"/>`:''}${arch(12,8)}${arch(-36,128)}${arch(60,128)}</svg>`;
  };
  const uri = s => `url("data:image/svg+xml,${encodeURIComponent(s)}")`;
  document.documentElement.style.setProperty('--doors', uri(doorSvg('#C2703D', '#2B1D14', '#2B1D14')));
  document.documentElement.style.setProperty('--doors-faint', uri(doorSvg('#2B1D14', '', '', true)));

  const MARK = 'assets/logo/suitiee-mark.png';
  const SPARK = '<svg class="sparkle" viewBox="0 0 24 24"><path fill="#E0A33D" d="M12 0C12.9 6.4 15.6 9.1 22 10 15.6 10.9 12.9 13.6 12 20 11.1 13.6 8.4 10.9 2 10 8.4 9.1 11.1 6.4 12 0Z"/></svg>';
  const ICON = {
    cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><circle cx="12" cy="15.5" r="1.6" fill="currentColor"/></svg>',
    coin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>',
    wallet:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 7h15a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2h11v3"/><circle cx="16.5" cy="13.5" r="1.5" fill="currentColor"/></svg>',
    trend:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>',
    star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.2l-5.9 3.2 1.3-6.5L2.5 9.3l6.6-.8z"/></svg>',
    units:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 21V10a7 7 0 0114 0v11z"/><circle cx="12" cy="11" r="2" fill="currentColor"/><path d="M11.2 13h1.6l.5 4h-2.6z" fill="currentColor"/></svg>',
    plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    pin:'<svg viewBox="0 0 24 28" fill="#C2703D"><path d="M12 0C5.4 0 0 5.2 0 11.6 0 20 12 28 12 28s12-8 12-16.4C24 5.2 18.6 0 12 0zm0 16a4.5 4.5 0 110-9 4.5 4.5 0 010 9z"/></svg>',
    map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>',
    img:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>'
  };
  const shards = (corner, warm=true) => {
    const L = corner === 'tr'
      ? [[1500,-40,520,180,'#3A2C21'],[1650,-40,440,340,'rgba(194,112,61,.55)'],[1800,-40,300,500,'rgba(224,163,61,.32)'],[1630,150,400,170,'rgba(243,235,221,.12)']]
      : [[-150,560,340,580,'#3A2C21'],[-170,720,390,430,'rgba(194,112,61,.55)'],[-190,870,640,300,'rgba(224,163,61,.32)'],[40,966,520,160,'rgba(243,235,221,.12)']];
    return L.map(([x,y,w,h,c]) => `<div class="shard" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${c}"></div>`).join('');
  };
  const pic = (src, cls, name, shape, ph) => src
    ? `<div class="photo ${cls}" data-pic="${name}" data-shape="${shape}"><img src="${esc(src)}" alt=""></div>`
    : `<div class="slot ${cls}" data-pic="${name}" data-shape="${shape}">${ICON[ph[0]]}<span>${ph[1]}</span><small>${ph[2]}</small></div>`;

  const S = [];

  // 1 · cover
  const CV = D.cover;
  S.push(`<section class="slide cover">
    <div class="grain"></div>
    <div class="arch-line"></div>
    ${pic(CV.photo,'arch','cover-photo','arch',['img','صورة الغلاف','cover.photo'])}
    ${SPARK.replace('class="sparkle"','class="sparkle" style="position:absolute;left:770px;top:110px;width:78px;height:78px"')}
    <img class="mark" data-img src="${MARK}" alt="Suitiee">
    <div class="word" data-t>Suitiee</div>
    <div class="tag" data-t>منصة وخدمات تشغيل لوحدات الضيافة</div>
    <div class="rule"></div>
    <div class="eyebrow eb" data-t>${esc(CV.eyebrow)}</div>
    <div class="for" data-t>${t(CV.property)} · مقدَّم إلى ${t(CV.owner)}</div>
    <div class="date" data-t>${t(CV.date)}</div>
    <div class="site ltr" data-t>suitiee.com</div>
  </section>`);

  // 2 · about
  const A = D.about;
  S.push(`<section class="slide about">
    <div class="poly"><div class="doors"></div></div>
    <div class="strip doors"></div>
    <div class="eyebrow eb" data-t>${esc(A.title)}</div>
    <h1 data-t>${br(A.headline)}</h1>
    <p class="p1" data-t>${t(A.paragraphs[0])}</p>
    <p class="p2" data-t>${t(A.paragraphs[1]||'')}</p>
    <div class="pills">${A.services.map(s=>`<span class="pill"><span data-t>${esc(s)}</span></span>`).join('')}</div>
  </section>`);

  // 3 · approach
  const P = D.approach;
  const colX = [751, 418, 84], rowY = [108, 336, 563, 789], cls = ['a','b','a'];
  let tiles = '';
  P.stages.forEach((s, c) => s.tiles.slice(0,4).forEach((x, r) => {
    tiles += `<div class="tile ${cls[c]}" style="left:${colX[c]}px;top:${rowY[r]}px"><span data-t>${esc(x)}</span></div>`;
  }));
  S.push(`<section class="slide approach">
    <div class="strip doors"></div>
    <div class="eyebrow eb" data-t>${esc(P.title)}</div>
    <h1 data-t>${br(P.headline)}</h1>
    <p class="p1" data-t>${t(P.paragraphs[0])}</p>
    <p class="p2" data-t>${t(P.paragraphs[1]||'')}</p>
    ${tiles}
    <div class="vlabel" data-t style="left:950px;top:118px">${esc(P.stages[0].label)}</div>
    <div class="vlabel" data-t style="left:620px;top:770px">${esc(P.stages[1].label)}</div>
    <div class="vlabel" data-t style="left:280px;top:118px">${esc(P.stages[2].label)}</div>
    <svg class="flow" viewBox="0 0 1920 1080" fill="none" stroke="#C2703D" stroke-width="3" stroke-dasharray="9 9" stroke-linecap="round">
      <defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C2703D" stroke="none"/></marker></defs>
      <path d="M974 270V775H676" marker-end="url(#ah)"/>
      <path d="M644 846V1004H304V336" marker-end="url(#ah)"/>
    </svg>
  </section>`);

  // 4 · stats
  const ST = D.stats;
  const cells = ST.items.slice(0,4).map((s,i) => {
    const right = i%2===0, top = i<2 ? 62 : 412;           // RTL: first item top-right
    const edge = right ? 'right:60px' : 'right:718px';      // card-relative
    const isAr = /[؀-ۿ]/.test(s.value) && !String(s.value).trim().startsWith('[');
    return `<div class="ic" style="${edge};top:${top+60}px">${ICON[s.icon]||ICON.plus}</div>
      <div class="sv" data-t style="${right?'right:186px':'right:844px'};top:${top+(s.label?44:58)}px;width:440px;${isAr?'font-size:104px':String(s.value).length>5?'font-size:92px':''}">${t(s.value)}</div>
      ${s.label?`<div class="sl" data-t style="${right?'right:186px':'right:844px'};top:${top+170}px;width:440px">${t(s.label)}</div>`:''}`;
  }).join('');
  S.push(`<section class="slide dark stats on-dark">
    ${ST.background?`<img class="bgphoto" src="${esc(ST.background)}" alt="">`:''}<div class="veil"></div>
    ${shards('tr')}${shards('bl')}
    <h1 data-t>${br(ST.headline)}</h1>
    <div class="card">
      <div class="hl"></div><div class="vl" style="top:60px;height:240px"></div><div class="vl" style="top:390px;height:240px"></div><div class="dot"></div>
      ${cells}
    </div>
  </section>`);

  // 5 · property
  const R = D.property;
  S.push(`<section class="slide dark prop on-dark">
    ${shards('tr')}${shards('bl')}
    ${pic(R.mapImage,'map','map-photo','round',['map','صورة الموقع على الخريطة','property.mapImage'])}
    <div class="info"></div>
    <div class="eyebrow eb" data-t>${esc(R.eyebrow)}</div>
    <div class="pname" data-t>${t(R.name)}</div>
    <div class="pin" style="position:absolute">${ICON.pin}</div>
    <div class="loc" data-t>${t(R.location)}</div>
    ${R.note?`<div class="note" data-t>${t(R.note)}</div>`:''}
    ${pic(R.photo,'pic','property-photo','round',['img','صورة واجهة العقار','property.photo'])}
  </section>`);

  // 6 · financial study
  const F = D.finance, days = F.daysPerYear || 365;
  const unitRev = F.units.map(u => F.scenarios.map((_,i) => u.count * u.rate[i] * days * u.occupancy[i]));
  const totRev  = F.scenarios.map((_,i) => unitRev.reduce((a,r) => a + r[i], 0));
  // a cost is either a share of revenue (pct) or a fixed monthly amount (monthly)
  const at = (v, i) => Array.isArray(v) ? v[i] : v;
  const costAmt = c => F.scenarios.map((_,i) => c.pct != null ? totRev[i] * at(c.pct, i) : at(c.monthly, i) * 12);
  const totCost = F.scenarios.map((_,i) => F.costs.reduce((a,c) => a + costAmt(c)[i], 0));
  const net     = F.scenarios.map((_,i) => totRev[i] - totCost[i]);
  const rows = [];   // also handed to the pptx exporter
  const row = (label, vals, kind='') => rows.push({label, vals: vals.map(String), kind});
  row(F.currencyNote, F.scenarios, 'head');
  F.units.forEach((u,k) => {
    row(u.countLabel, F.scenarios.map(()=>u.count));
    row(u.rateLabel, u.rate);
    row('متوسط نسبة الإشغال السنوية', u.occupancy.map(pct));
    row(u.totalLabel, unitRev[k].map(num), 'bold');
  });
  row('التكاليف التشغيلية السنوية', [], 'sec');
  F.costs.forEach(c => row(c.name, c.pct != null ? F.scenarios.map((_,i) => pct(at(c.pct, i))) : costAmt(c).map(num)));
  row('إجمالي التكاليف التشغيلية السنوية', totCost.map(num), 'tot');
  row('صافي الأرباح للمالك سنويًا', net.map(num), 'net');
  if (F.showMonthly) row('متوسط صافي الربح الشهري للمالك', net.map(v => num(v / 12)), 'mo');
  window.__FIN = { title:'الدراسة المالية', sec:'الإيراد المتوقع السنوي', rows, foot:[D.contact.companyLine, D.contact.phone], notes:F.notes };
  const notes = [].concat(F.notes || []);
  const nReg = rows.filter(r => !['sec','head','net'].includes(r.kind)).length + 1;      // + footer row
  const nSec = rows.filter(r => r.kind === 'sec').length + 1;
  const rh = Math.max(30, Math.min(46, Math.floor((1024 - 84 - 52*nSec - 56 - 66 - (60 + 36*notes.length)) / nReg)));
  window.__FIN.rh = rh; window.__FIN.notes = notes;
  const html = rows.map(r => r.kind === 'sec'
      ? `<div class="sec">${esc(r.label)}</div>`
      : `<div class="r ${r.kind}"><div>${esc(r.label)}</div>${r.vals.map((v,i)=>`<div class="n c${i%3}">${esc(v)}</div>`).join('')}</div>`).join('');
  S.push(`<section class="slide fin" style="--rh:${rh}px">
    <div class="sheet" data-table>
      <div class="title"><img src="assets/logo/suitiee-mark-light.png" alt="">الدراسة المالية<span class="ttl-site">suitiee.com</span></div>
      <div class="sec">الإيراد المتوقع السنوي</div>
      ${html}
      <div class="r foot"><div>${esc(D.contact.companyLine)}</div><div></div><div></div><div class="n" style="justify-content:flex-start">${t(D.contact.phone)}</div></div>
      <div class="notes"><b>ملاحظات الدراسة</b>${notes.map(n => `<div>· ${t(n)}</div>`).join('')}</div>
    </div>
  </section>`);

  // 7 · closing
  const C = D.contact;
  S.push(`<section class="slide close">
    <div class="grain"></div>
    <div class="band doors-faint"></div>
    <img class="mark" data-img src="${MARK}" alt="Suitiee" style="right:${150 + 300 - 103}px">
    <div class="word" data-t>Suitiee</div>
    <div class="tag" data-t>منصة وخدمات تشغيل لوحدات الضيافة</div>
    <div class="divider"></div>
    <h2 data-t>${br(C.headline)}</h2>
    <div class="phone" data-t>${t(C.phone)}</div>
    <div class="site ltr" data-t>${esc(C.website)}</div>
    <div class="legal" data-t>${t(C.legalName)}<br>السجل التجاري: ${t(C.cr)}</div>
  </section>`);

  document.getElementById('deck').innerHTML = S.map(s => `<div class="frame">${s}</div>`).join('');
  const fit = () => document.documentElement.style.setProperty('--z', Math.min(1, (document.documentElement.clientWidth - 32) / 1920));
  fit(); addEventListener('resize', fit);
  addEventListener('beforeprint', () => document.documentElement.style.setProperty('--z', 1));
  addEventListener('afterprint', fit);
})();
</script>
</body>
</html>
